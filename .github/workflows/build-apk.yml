name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install project dependencies
      run: npm install
      
    - name: Build Next.js app
      run: npm run build
      
    - name: Install Capacitor dependencies
      run: |
        npm install @capacitor/cli @capacitor/core @capacitor/android
        npx cap version
      
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
      
    - name: Initialize Capacitor
      run: |
        npx cap init MindSwap com.mindswap.app --web-dir .next
        npx cap add android
        
        # Crear configuración manualmente
        echo '{
          "appId": "com.mindswap.app", 
          "appName": "MindSwap",
          "webDir": ".next",
          "server": {
            "url": "https://opulent-tribble-r4ppwpppw777fxpxx-3000.app.github.dev",
            "cleartext": true
          }
        }' > capacitor.config.json
        
        npx cap sync
      
    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mindswap-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk